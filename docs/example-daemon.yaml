# Example daemon-engine configuration file
#
# This file demonstrates all available configuration options for daemon-engine.
# Place this file as daemon.yaml in your project directory or at
# ~/.config/daemon-engine/daemon.yaml

# Path to your workspace directory (required)
# Supports tilde expansion (e.g., ~/my-workspace)
workspace: ./workspace

# Optional: Timezone for date/time injection in system prompt
# Default: "UTC"
timezone: "America/New_York"

# Optional: Maximum characters per workspace file
# Default: 20000
workspace_max_file_chars: 20000

# Optional: Agent identity configuration
agent:
  # Agent name used in system prompt identity line and runtime info
  # Default: "a helpful AI assistant"
  name: "Rook"

# Optional: LLM Provider configuration
# Use this to select between different LLM providers and modes
provider:
  # Provider type: "claude-cli" (default, uses Claude Code billing hack),
  #                "claude-api" (direct Anthropic API with API key billing),
  #                "claude-oauth" (OAuth session token, Claude Pro/Max subscription),
  #                "gemini" (Google Gemini API)
  type: "claude-cli"
  
  # Model identifier (provider-specific)
  # For claude-cli/claude-api/claude-oauth: "opus", "sonnet", or full model like "claude-3-5-sonnet-20241022"
  # For gemini: "gemini-1.5-pro-latest", "gemini-1.5-flash-latest", etc.
  # Optional, defaults to provider's default model
  model: "sonnet"
  
  # API Key (required for claude-api and gemini, not used for claude-cli)
  # For claude-api: Anthropic API key (or set ANTHROPIC_API_KEY env var)
  # For gemini: Google API key (or set GEMINI_API_KEY env var)
  # apiKey: "your-api-key-here"
  
  # claude-oauth: Session token or credential store path
  # sessionToken: "sk-ant-oat01-..."  # Or set ANTHROPIC_OAUTH_TOKEN env
  # credentialStorePath: "~/.config/daemon-engine/anthropic-oauth.json"  # Optional, for refresh
  
  # Maximum tokens to generate (claude-api only, optional)
  # Default: 4096
  maxTokens: 4096
  
  # Retry configuration (optional)
  # retry:
  #   enabled: true
  #   maxAttempts: 5
  #   initialDelayMs: 1000
  #   maxDelayMs: 60000
  #   multiplier: 2

# Claude CLI configuration (required for claude-cli provider, or when provider not specified)
claude:
  # Model to use: "opus", "sonnet", or full model identifier
  # Optional, defaults to Claude CLI's default
  model: "sonnet"
  
  # Skip permission prompts for file/shell operations
  # Optional, defaults to false
  skipPermissions: true
  
  # Timeout in milliseconds for Claude CLI operations
  # Optional, defaults to no timeout
  timeout: 30000

# Heartbeat configuration (required)
heartbeat:
  # Whether heartbeat polling is enabled
  enabled: true
  
  # Interval between heartbeat checks in milliseconds
  intervalMs: 300000  # 5 minutes
  
  # Prompt to send on each heartbeat
  # Optional, defaults to "HEARTBEAT"
  prompt: "STATUS_CHECK"
  
  # Optional: Active hours window in UTC (0-23)
  # Heartbeat only runs during these hours
  # Format: [startHour, endHour]
  activeHours: [9, 17]  # 9 AM to 5 PM UTC

# Gateway HTTP server configuration (required)
gateway:
  # Port to listen on (0 = random available port)
  port: 8080
  
  # Optional: Host to bind to
  # Default: "0.0.0.0" (all interfaces)
  host: "0.0.0.0"
  
  # Webhook configurations by type
  # Each hook requires a bearer token and session key
  hooks:
    github:
      token: "your-github-webhook-token"
      sessionKey: "github:default"
    
    slack:
      token: "your-slack-webhook-token"
      sessionKey: "slack:general"

# Session storage configuration (required)
sessions:
  # Directory to store session transcripts (JSONL files)
  storeDir: ./sessions
  
  # Optional: Maximum context tokens before triggering session reset
  # Default: 150000
  maxContextTokens: 150000

# Optional: Observability API configuration
# Enables external monitoring endpoints with bearer token authentication
observability:
  # Bearer token for authentication
  # If not set, observability endpoints are accessible without auth
  # Can use environment variable: token: ${OBSERVABILITY_TOKEN}
  token: "your-secret-observability-token"

# Optional: Channel configurations for message tool
# Enables the agent to send messages to communication channels autonomously
channels:
  # Discord webhook channel
  # Get webhook URL from Discord: Server Settings > Integrations > Webhooks
  discord-general:
    type: "discord-webhook"
    # Discord webhook URL (supports environment variable interpolation)
    url: "https://discord.com/api/webhooks/123456789/your-webhook-token"
    # Note: Messages are automatically truncated to Discord's 2000 character limit
  
  # Matrix room channel
  # Get access token from Matrix client and room ID from room settings
  matrix-ops:
    type: "matrix"
    # Matrix homeserver URL
    homeserver: "https://matrix.org"
    # Matrix room ID (e.g., !AbCdEfGhIj:matrix.org)
    room_id: "!your-room-id:matrix.org"
    # Matrix access token (or use environment variable: ${MATRIX_TOKEN})
    access_token: "your-matrix-access-token"
  
  # Generic webhook (Slack, Teams, custom services)
  alerts:
    type: "webhook"
    # Webhook URL
    url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    # HTTP method (optional, defaults to POST)
    method: "POST"
    # Custom headers (optional)
    headers:
      "X-Custom-Header": "value"
    # Body template with {{content}} placeholder (optional)
    # If not provided, defaults to JSON: {"content": "message"}
    body_template: '{"text": "{{content}}"}'
  
  # Simple webhook example (minimal configuration)
  simple-webhook:
    type: "webhook"
    url: "https://example.com/webhook"
    # Uses default POST method and JSON body: {"content": "message"}
